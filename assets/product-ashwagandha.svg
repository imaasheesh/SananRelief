<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <radialGradient id="ash-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FCF9F3"/>
      <stop offset="60%" stop-color="#F2ECE1"/>
      <stop offset="100%" stop-color="#E5DDD0"/>
    </radialGradient>
    <linearGradient id="ash-pedestal-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFE8DE"/>
      <stop offset="50%" stop-color="#E5DCCE"/>
      <stop offset="100%" stop-color="#D9CEBD"/>
    </linearGradient>
    <linearGradient id="ash-pedestal-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D5C9B7"/>
      <stop offset="100%" stop-color="#B8A892"/>
    </linearGradient>

    <!-- Dark Amber Glass Jar -->
    <linearGradient id="ash-amber-glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#221105"/>
      <stop offset="15%" stop-color="#4F270B"/>
      <stop offset="35%" stop-color="#7C3E10"/>
      <stop offset="50%" stop-color="#4F270B"/>
      <stop offset="75%" stop-color="#7A3D10"/>
      <stop offset="90%" stop-color="#4A2308"/>
      <stop offset="100%" stop-color="#180C03"/>
    </linearGradient>

    <linearGradient id="ash-cap-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D2D2D"/>
      <stop offset="30%" stop-color="#555555"/>
      <stop offset="50%" stop-color="#2D2D2D"/>
      <stop offset="70%" stop-color="#555555"/>
      <stop offset="100%" stop-color="#1E1E1E"/>
    </linearGradient>

    <filter id="ash-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#554433" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#ash-bg)"/>

  <!-- Botanical Leaves on Left -->
  <g opacity="0.9">
    <path d="M 140 290 Q 90 260 50 250" stroke="#486838" stroke-width="3" fill="none"/>
    <path d="M 50 250 C 40 210 65 180 85 160 C 95 190 90 230 50 250 Z" fill="#4B6E38"/>
    <path d="M 70 230 C 50 200 45 160 30 140 C 45 170 65 210 70 230 Z" fill="#5A8545"/>
    <path d="M 90 240 C 95 200 120 180 140 170 C 130 200 115 230 90 240 Z" fill="#3E5C2F"/>
  </g>

  <!-- Stone Pedestal -->
  <g filter="url(#ash-shadow)">
    <!-- Base slab -->
    <path d="M 80 370 C 80 370 120 420 200 420 C 280 420 320 370 320 370 L 320 405 C 320 405 280 455 200 455 C 120 455 80 405 80 405 Z" fill="url(#ash-pedestal-front)"/>
    <ellipse cx="200" cy="370" rx="120" ry="34" fill="url(#ash-pedestal-top)"/>

    <!-- Top slab -->
    <path d="M 95 345 C 95 345 130 385 200 385 C 270 385 305 345 305 345 L 305 365 C 305 365 270 405 200 405 C 130 405 95 365 95 365 Z" fill="url(#ash-pedestal-front)"/>
    <ellipse cx="200" cy="345" rx="105" ry="28" fill="url(#ash-pedestal-top)"/>
    <ellipse cx="150" cy="345" rx="5" ry="2" fill="#C4B6A0" opacity="0.6"/>
    <ellipse cx="245" cy="347" rx="4" ry="1.5" fill="#C4B6A0" opacity="0.5"/>
  </g>

  <!-- Ashwagandha Root Botanical elements in front of stone right side -->
  <g opacity="0.85">
    <ellipse cx="270" cy="340" rx="9" ry="5" fill="#C9AF85"/>
    <ellipse cx="282" cy="342" rx="7" ry="4" fill="#BCA277"/>
    <ellipse cx="260" cy="343" rx="8" ry="4.5" fill="#C9AF85"/>
  </g>

  <!-- Jar Shadow -->
  <ellipse cx="200" cy="336" rx="52" ry="13" fill="#58432F" opacity="0.45" filter="url(#ash-shadow)"/>

  <!-- Apothecary Jar -->
  <g filter="url(#ash-shadow)">
    <!-- Jar Body -->
    <path d="M 158 200 Q 158 190 170 186 L 170 178 L 230 178 L 230 186 Q 242 190 242 200 L 242 324 C 242 334 232 338 200 338 C 168 338 158 334 158 324 Z" fill="url(#ash-amber-glass)"/>
    <!-- Glass sheen -->
    <path d="M 162 200 L 164 322 C 164 326 172 328 174 324 L 174 200 Z" fill="#FFFFFF" opacity="0.2"/>

    <!-- Black Lid with Brushed Rim -->
    <rect x="166" y="166" width="68" height="15" rx="2" fill="url(#ash-cap-metal)"/>
    <line x1="166" y1="172" x2="234" y2="172" stroke="#444" stroke-width="0.8"/>

    <!-- Premium White Label -->
    <rect x="162" y="206" width="76" height="108" rx="3" fill="#FAF6EE"/>
    <rect x="162" y="206" width="4" height="108" fill="#000000" opacity="0.12"/>
    <rect x="234" y="206" width="4" height="108" fill="#000000" opacity="0.12"/>

    <!-- Label Brand & Logo -->
    <path d="M 200 216 C 196 219 194 223 200 227 C 206 223 204 219 200 216 Z" fill="#439798"/>
    <circle cx="200" cy="221" r="1.5" fill="#FAF6EE"/>
    <text x="200" y="238" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="8" font-weight="800" fill="#1C2B2B" letter-spacing="1.5">SANAN</text>
    <line x1="182" y1="243" x2="218" y2="243" stroke="#439798" stroke-width="0.8"/>

    <!-- Label Product Name -->
    <text x="200" y="258" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="10.5" font-weight="400" fill="#182626">Ashwagandha</text>
    <text x="200" y="269" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="5.5" font-weight="700" fill="#439798" letter-spacing="0.8">ORGANIC EXTRACT</text>
    <text x="200" y="280" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="4.5" fill="#758282">Calm • Balance • Vitality</text>
    <text x="200" y="288" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="4.5" fill="#758282">KSM-66 Premium Grade</text>
    <!-- Count -->
    <text x="200" y="304" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="5" font-weight="600" fill="#1C2B2B">60 Capsules</text>
  </g>
</svg>
