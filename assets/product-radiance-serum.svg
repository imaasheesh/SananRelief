<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <radialGradient id="rad-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FCF9F5"/>
      <stop offset="60%" stop-color="#F5ECE5"/>
      <stop offset="100%" stop-color="#E8DDD3"/>
    </radialGradient>
    <linearGradient id="rad-pedestal-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFE8DE"/>
      <stop offset="50%" stop-color="#E5DCCE"/>
      <stop offset="100%" stop-color="#D9CEBD"/>
    </linearGradient>
    <linearGradient id="rad-pedestal-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D5C9B7"/>
      <stop offset="100%" stop-color="#B8A892"/>
    </linearGradient>

    <!-- Golden Radiant Elixir Glass Gradient -->
    <linearGradient id="rad-gold-glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8F5E12"/>
      <stop offset="20%" stop-color="#D99B26"/>
      <stop offset="40%" stop-color="#F7C952"/>
      <stop offset="60%" stop-color="#DB9E27"/>
      <stop offset="85%" stop-color="#F0BF45"/>
      <stop offset="100%" stop-color="#7A4D0B"/>
    </linearGradient>

    <radialGradient id="rad-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF2CE" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#FCDD85" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F7C952" stop-opacity="0"/>
    </radialGradient>

    <!-- Dew Sphere Bubble Gradient -->
    <radialGradient id="rad-bubble" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#E7DAFF" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#D0B8FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#9E70FF" stop-opacity="0.15"/>
    </radialGradient>

    <filter id="rad-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#554433" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#rad-bg)"/>

  <!-- Glowing Aura behind bottle -->
  <circle cx="200" cy="240" r="110" fill="url(#rad-glow)"/>

  <!-- Iridescent Floating Dew Spheres -->
  <circle cx="140" cy="180" r="18" fill="url(#rad-bubble)"/>
  <circle cx="145" cy="174" r="5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="152" cy="198" r="9" fill="url(#rad-bubble)"/>

  <circle cx="260" cy="220" r="22" fill="url(#rad-bubble)"/>
  <circle cx="265" cy="214" r="6" fill="#FFFFFF" opacity="0.8"/>

  <!-- Purple Orchid / Blossom on Stone (Right) -->
  <g opacity="0.95">
    <ellipse cx="270" cy="305" rx="14" ry="10" fill="#7C3AED" opacity="0.85"/>
    <ellipse cx="282" cy="318" rx="12" ry="9" fill="#6D28D9" opacity="0.85"/>
    <ellipse cx="258" cy="318" rx="12" ry="9" fill="#8B5CF6" opacity="0.85"/>
    <ellipse cx="270" cy="326" rx="14" ry="10" fill="#6D28D9" opacity="0.85"/>
    <circle cx="270" cy="317" r="4.5" fill="#FCD34D"/>
  </g>

  <!-- Stone Pedestal -->
  <g filter="url(#rad-shadow)">
    <path d="M 80 370 C 80 370 120 420 200 420 C 280 420 320 370 320 370 L 320 405 C 320 405 280 455 200 455 C 120 455 80 405 80 405 Z" fill="url(#rad-pedestal-front)"/>
    <ellipse cx="200" cy="370" rx="120" ry="34" fill="url(#rad-pedestal-top)"/>

    <path d="M 95 345 C 95 345 130 385 200 385 C 270 385 305 345 305 345 L 305 365 C 305 365 270 405 200 405 C 130 405 95 365 95 365 Z" fill="url(#rad-pedestal-front)"/>
    <ellipse cx="200" cy="345" rx="105" ry="28" fill="url(#rad-pedestal-top)"/>
    <ellipse cx="140" cy="344" rx="5" ry="2" fill="#C4B6A0" opacity="0.6"/>
    <ellipse cx="230" cy="349" rx="6" ry="2.2" fill="#C4B6A0" opacity="0.5"/>
  </g>

  <!-- Bottle Shadow -->
  <ellipse cx="200" cy="336" rx="40" ry="12" fill="#58432F" opacity="0.45" filter="url(#rad-shadow)"/>

  <!-- Radiance Serum Bottle (Golden Amber Glass) -->
  <g filter="url(#rad-shadow)">
    <path d="M 168 220 Q 168 174 186 164 L 186 150 L 214 150 L 214 164 Q 232 174 232 220 L 232 326 C 232 334 224 338 200 338 C 176 338 168 334 168 326 Z" fill="url(#rad-gold-glass)"/>
    <!-- Specular highlight -->
    <path d="M 172 220 Q 172 180 187 170 L 188 324 C 188 327 180 326 172 322 Z" fill="#FFFFFF" opacity="0.38"/>

    <!-- Dropper Collar & Pipette Top -->
    <rect x="184" y="146" width="32" height="12" rx="2" fill="#1C1D1D"/>
    <line x1="188" y1="148" x2="188" y2="156" stroke="#444" stroke-width="1"/>
    <line x1="194" y1="148" x2="194" y2="156" stroke="#444" stroke-width="1"/>
    <line x1="200" y1="148" x2="200" y2="156" stroke="#444" stroke-width="1"/>
    <line x1="206" y1="148" x2="206" y2="156" stroke="#444" stroke-width="1"/>
    <line x1="212" y1="148" x2="212" y2="156" stroke="#444" stroke-width="1"/>

    <path d="M 189 146 C 189 126 194 112 200 112 C 206 112 211 126 211 146 Z" fill="#181919"/>
    <path d="M 194 140 C 194 128 196 116 199 115 Z" fill="#FFFFFF" opacity="0.25"/>

    <!-- Clean Label -->
    <rect x="169" y="204" width="62" height="112" rx="2" fill="#FAF6EE"/>
    <rect x="169" y="204" width="3.5" height="112" fill="#000000" opacity="0.12"/>
    <rect x="227.5" y="204" width="3.5" height="112" fill="#000000" opacity="0.12"/>

    <path d="M 200 216 C 196 219 194 223 200 227 C 206 223 204 219 200 216 Z" fill="#D97706"/>
    <circle cx="200" cy="221" r="1.5" fill="#FAF6EE"/>
    <text x="200" y="238" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="7.5" font-weight="800" fill="#1C2B2B" letter-spacing="1.5">SANAN</text>
    <line x1="184" y1="243" x2="216" y2="243" stroke="#D97706" stroke-width="0.8"/>

    <text x="200" y="258" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="10" font-weight="400" fill="#182626">Radiance</text>
    <text x="200" y="269" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="5" font-weight="700" fill="#D97706" letter-spacing="0.8">FACE SERUM</text>
    <text x="200" y="280" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="4.2" fill="#758282">Brighten • Hydrate • Glow</text>
    <text x="200" y="288" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="4.2" fill="#758282">Bakuchiol &amp; Vitamin C</text>
    <text x="200" y="304" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="4.8" font-weight="600" fill="#1C2B2B">30 ml</text>
  </g>
</svg>
