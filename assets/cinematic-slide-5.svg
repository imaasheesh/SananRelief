<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="nightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B111A"/>
      <stop offset="40%" stop-color="#121B28"/>
      <stop offset="75%" stop-color="#1B283A"/>
      <stop offset="100%" stop-color="#080C12"/>
    </linearGradient>
    <radialGradient id="moonlight" cx="68%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#E2EEF9" stop-opacity="0.85"/>
      <stop offset="30%" stop-color="#A5C6E6" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#3C5B80" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0B111A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waterMirror" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121D2C"/>
      <stop offset="50%" stop-color="#0A111B"/>
      <stop offset="100%" stop-color="#060A10"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#nightBg)"/>

  <!-- Celestial Moonlight Glow -->
  <circle cx="820" cy="220" r="300" fill="url(#moonlight)"/>

  <!-- Slender Crescent Moon -->
  <path d="M820,130 A60,60 0 0,0 870,210 A65,65 0 1,1 820,130 Z" fill="#F4F9FF" opacity="0.95"/>

  <!-- Faint Constellations & Stars -->
  <g fill="#FFFFFF">
    <circle cx="680" cy="90" r="1.5" opacity="0.8"/>
    <circle cx="720" cy="120" r="1.2" opacity="0.6"/>
    <circle cx="760" cy="80" r="2" opacity="0.9"/>
    <circle cx="940" cy="100" r="1.5" opacity="0.7"/>
    <circle cx="990" cy="140" r="1.8" opacity="0.85"/>
    <circle cx="1060" cy="85" r="1.2" opacity="0.5"/>
    <circle cx="580" cy="140" r="1.4" opacity="0.65"/>
    <circle cx="480" cy="100" r="1.8" opacity="0.8"/>
  </g>

  <!-- Distant Night Mountain Silhouette -->
  <path d="M0,420 L220,360 L450,440 L680,350 L890,410 L1080,340 L1200,390 L1200,675 L0,675 Z" fill="#0C141F"/>

  <!-- Obsidian Reflection Pool Water -->
  <rect x="0" y="490" width="1200" height="185" fill="url(#waterMirror)"/>

  <!-- Water Ripples & Moon Reflection -->
  <ellipse cx="820" cy="515" rx="140" ry="8" fill="#587BA3" opacity="0.35"/>
  <ellipse cx="820" cy="535" rx="90" ry="5" fill="#84A7D0" opacity="0.45"/>
  <ellipse cx="820" cy="555" rx="60" ry="3.5" fill="#B3D0F2" opacity="0.6"/>
  <ellipse cx="820" cy="575" rx="35" ry="2" fill="#E2EEF9" opacity="0.75"/>

  <!-- Floating Water Lily / Night Lotus & Aromatic Herb Sprigs -->
  <g transform="translate(480, 480)">
    <!-- Obsidian River Stone Pedestal -->
    <ellipse cx="80" cy="40" rx="110" ry="32" fill="#141E2B" stroke="#2D3E54" stroke-width="2"/>

    <!-- Sanan Sleep Pulse Oil Roll-On Vial -->
    <rect x="55" y="-60" width="28" height="90" rx="14" fill="#0E1724" stroke="#486B92" stroke-width="2"/>
    <rect x="58" y="-55" width="22" height="40" rx="2" fill="#E2EEF9" opacity="0.85"/>
    <text x="69" y="-30" font-family="'DM Sans', sans-serif" font-size="5" font-weight="700" fill="#121B28" text-anchor="middle">SLEEP</text>
    <rect x="62" y="-80" width="14" height="20" rx="3" fill="#DCE9F5"/>

    <!-- Lavender Sprigs -->
    <path d="M120,40 Q150,-10 160,-60" fill="none" stroke="#3D506B" stroke-width="2.5"/>
    <circle cx="160" cy="-60" r="5" fill="#8A9BB5"/>
    <circle cx="155" cy="-50" r="4.5" fill="#6C7E9E"/>
    <circle cx="150" cy="-40" r="5" fill="#8A9BB5"/>
    <circle cx="145" cy="-30" r="4" fill="#6C7E9E"/>

    <!-- Chamomile Flower Blossom -->
    <circle cx="20" cy="35" r="9" fill="#E8B83D"/>
    <ellipse cx="20" cy="18" rx="4" ry="9" fill="#FFFFFF" opacity="0.9"/>
    <ellipse cx="20" cy="52" rx="4" ry="9" fill="#FFFFFF" opacity="0.9"/>
    <ellipse cx="3" cy="35" rx="9" ry="4" fill="#FFFFFF" opacity="0.9"/>
    <ellipse cx="37" cy="35" rx="9" ry="4" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Ambient Blue Luminous Vapor Particles -->
  <circle cx="680" cy="430" r="2.5" fill="#A7C7E7" opacity="0.7"/>
  <circle cx="740" cy="390" r="2" fill="#A7C7E7" opacity="0.6"/>
  <circle cx="610" cy="460" r="3" fill="#A7C7E7" opacity="0.8"/>
  <circle cx="830" cy="410" r="1.5" fill="#FFFFFF" opacity="0.85"/>
</svg>

