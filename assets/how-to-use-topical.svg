<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="topBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="50%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>
    <linearGradient id="jointGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </linearGradient>
    <filter id="topShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E3A8A" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="400" height="320" rx="16" fill="url(#topBg)"/>

  <!-- Stylized Knee / Joint Contour -->
  <path d="M140 320 C140 230 160 170 200 150 C240 170 260 230 260 320 Z" fill="#93C5FD" opacity="0.4"/>
  <circle cx="200" cy="180" r="45" fill="url(#jointGlow)"/>

  <!-- Therapeutic Healing Concentric Rings -->
  <circle cx="200" cy="180" r="30" fill="none" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <circle cx="200" cy="180" r="50" fill="none" stroke="#0284C7" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.4"/>
  <circle cx="200" cy="180" r="70" fill="none" stroke="#0284C7" stroke-width="0.8" opacity="0.25"/>

  <!-- Caring Hands Silhouette Massaging Joint -->
  <path d="M120 230 C140 170 170 160 190 175 C210 190 200 220 170 250 Z" fill="#60A5FA" opacity="0.75" filter="url(#topShadow)"/>
  <path d="M280 230 C260 170 230 160 210 175 C190 190 200 220 230 250 Z" fill="#3B82F6" opacity="0.75" filter="url(#topShadow)"/>

  <!-- Method Label Pill -->
  <rect x="20" y="20" width="110" height="30" rx="15" fill="#FFFFFF" filter="url(#topShadow)"/>
  <text x="75" y="39" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#1D4ED8" text-anchor="middle">TOPICALLY</text>
</svg>