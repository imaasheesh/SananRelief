<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <defs>
    <linearGradient id="jarCapGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E5E7EB"/>
      <stop offset="100%" stop-color="#D1D5DB"/>
    </linearGradient>
    <linearGradient id="surgeBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14532D"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
    <filter id="jarShadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Ribbed White Cap -->
  <rect x="25" y="10" width="150" height="24" rx="4" fill="url(#jarCapGrad3)" stroke="#9CA3AF" stroke-width="1.2" filter="url(#jarShadow3)"/>
  <!-- Cap Vertical Ribs -->
  <line x1="35" y1="12" x2="35" y2="32" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="45" y1="12" x2="45" y2="32" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="55" y1="12" x2="55" y2="32" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="65" y1="12" x2="65" y2="32" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="75" y1="12" x2="75" y2="32" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="85" y1="12" x2="85" y2="32" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="95" y1="12" x2="95" y2="32" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="105" y1="12" x2="105" y2="32" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="115" y1="12" x2="115" y2="32" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="125" y1="12" x2="125" y2="32" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="135" y1="12" x2="135" y2="32" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="145" y1="12" x2="145" y2="32" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="155" y1="12" x2="155" y2="32" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="165" y1="12" x2="165" y2="32" stroke="#D1D5DB" stroke-width="1.5"/>

  <!-- Jar Body -->
  <rect x="22" y="32" width="156" height="74" rx="6" fill="url(#surgeBodyGrad)" stroke="#22C55E" stroke-width="1" filter="url(#jarShadow3)"/>
  
  <!-- Label Graphic: surge with lime accent -->
  <text x="32" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="800" fill="#86EFAC" letter-spacing="1">five</text>
  <text x="56" y="74" font-family="'Plus Jakarta Sans', Impact, sans-serif" font-size="28" font-weight="900" fill="#A3E635" letter-spacing="0.5">surge</text>
  
  <!-- Subtle dosage badge -->
  <circle cx="150" cy="72" r="14" fill="#15803D" opacity="0.6"/>
  <text x="150" y="70" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="800" fill="#BBF7D0">100%</text>
  <text x="150" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="800" fill="#FFFFFF">SATIVA</text>
</svg>