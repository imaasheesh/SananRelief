<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bnTopBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2EEF5"/>
      <stop offset="50%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#DEE7E2"/>
    </linearGradient>
  </defs>
  <rect width="340" height="600" rx="28" fill="url(#bnTopBg)"/>
  <!-- Lavender & Aloe Botanical Leaves -->
  <g fill="#5C7A6D" opacity="0.18" transform="translate(60, 50)">
    <path d="M20,20 C60,40 80,100 70,160 C40,120 20,80 20,20 Z"/>
    <path d="M70,80 C120,80 150,130 140,190 C100,160 70,120 70,80 Z"/>
  </g>
  <!-- Cream Jar & Botanical Aloe Illustration -->
  <g transform="translate(125, 260)">
    <!-- Aura Glow -->
    <circle cx="45" cy="80" r="95" fill="#FAF5ED" opacity="0.8"/>
    <!-- Cream Jar -->
    <rect x="0" y="45" width="90" height="70" rx="14" fill="#D5E2D9"/>
    <rect x="5" y="50" width="80" height="60" rx="10" fill="#E8F1EC"/>
    <!-- White Cap -->
    <rect x="-4" y="24" width="98" height="26" rx="8" fill="#FFFFFF" stroke="#D3DFD7" stroke-width="2"/>
    <!-- Label -->
    <rect x="15" y="65" width="60" height="30" rx="4" fill="#FAF8F2"/>
    <circle cx="45" cy="80" r="6" fill="#439798"/>
  </g>
</svg>
