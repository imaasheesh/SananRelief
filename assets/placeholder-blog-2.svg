<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAEFEA"/>
      <stop offset="50%" stop-color="#F4F8F4"/>
      <stop offset="100%" stop-color="#DCE6DE"/>
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5C7BC"/>
      <stop offset="100%" stop-color="#8F9485"/>
    </linearGradient>
    <filter id="mortarShadow">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2D3B31" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="600" height="380" fill="url(#bgGrad2)"/>

  <!-- Botanical branch on left -->
  <g fill="#439798" opacity="0.22" transform="translate(60, 180) rotate(-20)">
    <path d="M0,0 C60,20 100,70 120,130 C70,110 30,70 0,0 Z"/>
    <path d="M40,40 C100,40 140,80 150,140 C100,130 60,90 40,40 Z"/>
    <path d="M-20,20 C30,30 60,80 70,140 C30,120 0,80 -20,20 Z"/>
  </g>

  <!-- Stone Mortar & Pestle in Center -->
  <g transform="translate(260, 160)" filter="url(#mortarShadow)">
    <!-- Mortar Bowl -->
    <ellipse cx="60" cy="90" rx="95" ry="40" fill="#787C6F"/>
    <path d="M-35,90 C-35,160 155,160 155,90 Z" fill="url(#stoneGrad)"/>
    <!-- Mortar Inner Hollow -->
    <ellipse cx="60" cy="85" rx="80" ry="32" fill="#585D51"/>
    <!-- Fresh botanical green paste inside -->
    <ellipse cx="60" cy="87" rx="65" ry="24" fill="#3D6E57"/>

    <!-- Pestle resting at angle -->
    <g transform="translate(70, 40) rotate(35)">
      <rect x="-14" y="-80" width="28" height="110" rx="14" fill="url(#stoneGrad)"/>
      <ellipse cx="0" cy="30" rx="18" ry="12" fill="#787C6F"/>
    </g>

    <!-- Fresh plant leaves spilling over edge -->
    <g transform="translate(10, 60)">
      <path d="M0,0 C20,-30 50,-40 60,-20 C45,5 20,10 0,0 Z" fill="#5BA188"/>
      <path d="M-10,15 C10,-10 35,-25 45,-5 C35,15 10,20 -10,15 Z" fill="#4B8C74"/>
    </g>
  </g>

  <!-- Small glass bowl with golden wellness tincture beside mortar -->
  <g transform="translate(380, 220)">
    <ellipse cx="40" cy="40" rx="45" ry="20" fill="#E2EEE8" stroke="#FFFFFF" stroke-width="2"/>
    <ellipse cx="40" cy="42" rx="38" ry="16" fill="#8EA840" opacity="0.85"/>
  </g>
</svg>
