<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="100%" stop-color="#EFE7DA"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#1A3D3E" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="36" fill="url(#bg)"/>
  <circle cx="400" cy="380" r="320" fill="url(#glow)"/>

  <!-- Minimal Decorative Rings -->
  <circle cx="400" cy="380" r="260" fill="none" stroke="#D4A373" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="400" cy="380" r="190" fill="none" stroke="#D4A373" stroke-opacity="0.16" stroke-width="1.5"/>

  <!-- Luxury Product Silhouette / Pouch -->
  <g filter="url(#softShadow)">
    <!-- Apothecary Pouch Silhouette -->
    <path d="M280,220 C280,210 290,200 305,200 L495,200 C510,200 520,210 520,220 L550,550 C552,575 535,595 510,595 L290,595 C265,595 248,575 250,550 Z"
          fill="#1A3D3E"/>

    <!-- Pouch Top Heat Seal -->
    <path d="M285,225 L515,225" stroke="#D4A373" stroke-width="4" stroke-dasharray="8 4" stroke-linecap="round"/>

    <!-- Subtle Golden Emblem -->
    <circle cx="400" cy="350" r="54" fill="none" stroke="#D4A373" stroke-width="2"/>
    <path d="M400,320 C410,340 425,355 425,365 C425,378 414,388 400,388 C386,388 375,378 375,365 C375,355 390,340 400,320 Z" fill="#D4A373"/>
    <circle cx="400" cy="365" r="4" fill="#1A3D3E"/>

    <!-- Pouch Brand Typography -->
    <text x="400" y="440" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">SANAN RELIEF</text>
    <text x="400" y="475" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#D4A373" text-anchor="middle" letter-spacing="3">CLINICAL VIJAYA VATIS</text>
    <text x="400" y="520" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="1.5">500MG WHOLE PLANT EXTRACT</text>
  </g>

  <!-- Editorial Card Floating Kicker (Bottom) -->
  <g transform="translate(180, 680)">
    <rect width="440" height="66" rx="33" fill="#FFFFFF" fill-opacity="0.9" stroke="rgba(45,110,111,0.15)" stroke-width="1"/>
    <text x="220" y="28" font-family="'Playfair Display', Georgia, serif" font-size="16" font-weight="700" fill="#1A3D3E" text-anchor="middle">DEEP CELLULAR COMFORT</text>
    <text x="220" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#5E7273" text-anchor="middle">Promotes REM Rest &amp; Musculoskeletal Ease</text>
  </g>
</svg>