<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="subBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF2F8"/>
      <stop offset="50%" stop-color="#FCE7F3"/>
      <stop offset="100%" stop-color="#FBCFE8"/>
    </linearGradient>
    <linearGradient id="goldDrop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="subShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#831843" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="400" height="320" rx="16" fill="url(#subBg)"/>
  <!-- Gentle Organic Face Profile Silhouette -->
  <path d="M80 320 C100 240 140 210 180 200 C210 190 220 180 210 160 C200 145 170 140 170 120 C170 90 200 60 220 50 C240 80 230 110 240 130 C250 145 280 160 280 180 C270 200 230 220 220 230 C200 250 190 280 190 320 Z" fill="#F472B6" opacity="0.35"/>
  
  <!-- Dropper Pipette Angle -->
  <g transform="rotate(-25 260 110)">
    <rect x="250" y="20" width="14" height="150" rx="3" fill="#FFFFFF" opacity="0.9" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="252" y="80" width="10" height="80" fill="url(#goldDrop)"/>
    <path d="M250 170 L257 195 L264 170 Z" fill="#FFFFFF" opacity="0.9"/>
    <!-- Golden Drop Falling from Pipette -->
    <path d="M257 205 C250 218 245 228 245 236 C245 246 250 252 257 252 C264 252 269 246 269 236 C269 228 264 218 257 205 Z" fill="url(#goldDrop)" filter="url(#subShadow)"/>
    <circle cx="253" cy="237" r="2.5" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Method Label Pill -->
  <rect x="20" y="20" width="120" height="30" rx="15" fill="#FFFFFF" filter="url(#subShadow)"/>
  <text x="80" y="39" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#BE185D" text-anchor="middle">SUBLINGUAL</text>
</svg>