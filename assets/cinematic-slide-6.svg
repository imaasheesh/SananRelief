<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="gutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B140E"/>
      <stop offset="45%" stop-color="#2D2015"/>
      <stop offset="85%" stop-color="#422E1F"/>
      <stop offset="100%" stop-color="#140E0A"/>
    </linearGradient>
    <radialGradient id="amberGutGlow" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#F5B86A" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#C47A2B" stop-opacity="0.3"/>
      <stop offset="75%" stop-color="#6B3F11" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1B140E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#gutBg)"/>
  <circle cx="720" cy="270" r="320" fill="url(#amberGutGlow)"/>

  <!-- Organic Terracotta Table Surface -->
  <path d="M0,520 Q600,500 1200,520 L1200,675 L0,675 Z" fill="#140E09"/>

  <!-- Triphala 3 Fruits: Amla, Haritaki, Bibhitaki -->
  <g transform="translate(680, 360)">
    <!-- Terracotta Bowl -->
    <ellipse cx="60" cy="110" rx="140" ry="40" fill="#2E1C12" stroke="#523220" stroke-width="2"/>
    <!-- Whole Amla Fruit -->
    <circle cx="10" cy="85" r="28" fill="#758A45"/>
    <circle cx="15" cy="80" r="8" fill="#9DBA5E" opacity="0.6"/>
    <!-- Haritaki Dry Nut -->
    <ellipse cx="65" cy="85" rx="22" ry="16" fill="#8A5A2B" transform="rotate(-20, 65, 85)"/>
    <!-- Bibhitaki Fruit -->
    <circle cx="115" cy="90" r="24" fill="#6B4120"/>
  </g>

  <!-- Golden Herbal Particles -->
  <circle cx="680" cy="280" r="2.5" fill="#FFEAA8" opacity="0.8"/>
  <circle cx="760" cy="310" r="3" fill="#FFEAA8" opacity="0.7"/>
  <circle cx="600" cy="350" r="1.5" fill="#FFEAA8" opacity="0.6"/>
</svg>

