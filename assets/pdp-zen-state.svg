<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#2D1B4E" />
      <stop offset="50%" stop-color="#190F2C" />
      <stop offset="100%" stop-color="#0E071A" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D061" />
      <stop offset="100%" stop-color="#E6AF2E" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="24" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)" />

  <!-- Botanical Ambient Glow -->
  <circle cx="400" cy="380" r="260" fill="#7C3AED" opacity="0.22" filter="url(#glow)" />

  <!-- Geometric Frame -->
  <rect x="40" y="40" width="720" height="720" rx="36" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  <rect x="60" y="60" width="680" height="680" rx="28" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

  <!-- Badge / Pill -->
  <g transform="translate(400, 140)">
    <rect x="-140" y="-24" width="280" height="48" rx="24" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    <text text-anchor="middle" y="7" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#E9D5FF" letter-spacing="3">LIFESTYLE PROTOCOL</text>
  </g>

  <!-- Central Botanical Emblem & Visual -->
  <g transform="translate(400, 390)">
    <!-- Central Pouch Silhouette -->
    <path d="M-130,-170 L130,-170 L115,190 Q115,220 75,220 L-75,220 Q-115,220 -115,190 Z" fill="#150C22" stroke="rgba(192, 132, 252, 0.4)" stroke-width="3" />
    <!-- Zipper Line -->
    <line x1="-120" y1="-140" x2="120" y2="-140" stroke="#A855F7" stroke-width="3" stroke-dasharray="6,4" />
    
    <!-- Botanical Leaf Emblem -->
    <circle cx="0" cy="-30" r="54" fill="rgba(168, 85, 247, 0.2)" stroke="#C084FC" stroke-width="1.5" />
    <path d="M0,-70 Q25,-40 25,-10 Q25,20 0,40 Q-25,20 -25,-10 Q-25,-40 0,-70 Z" fill="url(#gold)" opacity="0.9" />
    <path d="M-15,-20 Q-45,-40 -65,-30 Q-45,-5 -20,10 Z" fill="url(#gold)" opacity="0.75" />
    <path d="M15,-20 Q45,-40 65,-30 Q45,-5 20,10 Z" fill="url(#gold)" opacity="0.75" />

    <!-- Pouch Typography -->
    <text text-anchor="middle" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="4">UPLIFT</text>
    <text text-anchor="middle" y="118" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#D8B4FE" letter-spacing="2">500mg VIJAYA EXTRACT • VATIS</text>
    <text text-anchor="middle" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#A855F7">FULL SPECTRUM ENTOURAGE EFFECT</text>
    
    <!-- Blackcurrant Berry Cluster Dots -->
    <circle cx="-65" cy="180" r="14" fill="#6B21A8" stroke="#A855F7" stroke-width="1.5" />
    <circle cx="-42" cy="192" r="16" fill="#581C87" stroke="#C084FC" stroke-width="1.5" />
    <circle cx="45" cy="185" r="15" fill="#581C87" stroke="#C084FC" stroke-width="1.5" />
    <circle cx="68" cy="175" r="13" fill="#6B21A8" stroke="#A855F7" stroke-width="1.5" />
  </g>

  <!-- Title & Subtitle at Bottom -->
  <text x="400" y="690" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="30" font-weight="700" fill="#FFFFFF">Drift Into The Zen State</text>
  <text x="400" y="726" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#CBD5E1">From Persistent Discomfort to Deep Ease</text>
</svg>