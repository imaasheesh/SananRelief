<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="dirBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="50%" stop-color="#D1FAE5"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldDrop2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="dirShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#064E3B" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="400" height="320" rx="16" fill="url(#dirBg)"/>

  <!-- Botanical Vijaya Leaf Structure -->
  <g transform="translate(200, 260) scale(1.6)" filter="url(#dirShadow)">
    <!-- Central Leaflet -->
    <path d="M0 -110 C-15 -70 -12 -30 0 0 C12 -30 15 -70 0 -110 Z" fill="url(#leafGrad)"/>
    <line x1="0" y1="0" x2="0" y2="-105" stroke="#34D399" stroke-width="1.2"/>
    <!-- Left Leaflets -->
    <path d="M0 -30 C-35 -60 -55 -40 -65 -30 C-45 -15 -20 -10 0 0 Z" fill="url(#leafGrad)"/>
    <path d="M0 -20 C-35 -40 -75 -25 -80 -10 C-55 0 -25 0 0 0 Z" fill="#047857"/>
    <!-- Right Leaflets -->
    <path d="M0 -30 C35 -60 55 -40 65 -30 C45 -15 20 -10 0 0 Z" fill="url(#leafGrad)"/>
    <path d="M0 -20 C35 -40 75 -25 80 -10 C55 0 25 0 0 0 Z" fill="#047857"/>
    <!-- Stem -->
    <line x1="0" y1="0" x2="0" y2="25" stroke="#065F46" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Luminous Golden Extract Droplet on Leaf Tip -->
  <path d="M200 65 C190 85 182 100 182 112 C182 126 190 135 200 135 C210 135 218 126 218 112 C218 100 210 85 200 65 Z" fill="url(#goldDrop2)" filter="url(#dirShadow)"/>
  <circle cx="194" cy="114" r="3.5" fill="#FFFFFF" opacity="0.85"/>

  <!-- Method Label Pill -->
  <rect x="20" y="20" width="120" height="30" rx="15" fill="#FFFFFF" filter="url(#dirShadow)"/>
  <text x="80" y="39" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#047857" text-anchor="middle">DIRECT DROPS</text>
</svg>