<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <radialGradient id="slp-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FCF9F6"/>
      <stop offset="60%" stop-color="#F2EDE7"/>
      <stop offset="100%" stop-color="#E5DDD3"/>
    </radialGradient>
    <linearGradient id="slp-pedestal-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFE8DE"/>
      <stop offset="50%" stop-color="#E5DCCE"/>
      <stop offset="100%" stop-color="#D9CEBD"/>
    </linearGradient>
    <linearGradient id="slp-pedestal-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D5C9B7"/>
      <stop offset="100%" stop-color="#B8A892"/>
    </linearGradient>

    <!-- Amber Glass Roll-on Gradient -->
    <linearGradient id="slp-amber-glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A1C08"/>
      <stop offset="15%" stop-color="#6F3B10"/>
      <stop offset="35%" stop-color="#A2581A"/>
      <stop offset="50%" stop-color="#612F0A"/>
      <stop offset="75%" stop-color="#9C5217"/>
      <stop offset="90%" stop-color="#6F3B10"/>
      <stop offset="100%" stop-color="#2D1505"/>
    </linearGradient>

    <linearGradient id="slp-cap-black" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="25%" stop-color="#383838"/>
      <stop offset="50%" stop-color="#1E1E1E"/>
      <stop offset="75%" stop-color="#353535"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>

    <filter id="slp-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#554433" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#slp-bg)"/>

  <!-- Purple Lavender Sprig on Right -->
  <g opacity="0.95">
    <!-- Lavender stem -->
    <path d="M 230 360 Q 260 300 295 240" stroke="#5B7052" stroke-width="2" fill="none"/>
    <!-- Lavender florets -->
    <ellipse cx="290" cy="242" rx="6" ry="4" fill="#7C5295"/>
    <ellipse cx="298" cy="245" rx="5" ry="3.5" fill="#9A7AA0"/>
    <ellipse cx="282" cy="254" rx="6.5" ry="4" fill="#6A3B82"/>
    <ellipse cx="290" cy="258" rx="6" ry="4" fill="#7C5295"/>
    <ellipse cx="275" cy="268" rx="6.5" ry="4" fill="#6A3B82"/>
    <ellipse cx="284" cy="272" rx="6" ry="4" fill="#8E69A5"/>
    <ellipse cx="268" cy="284" rx="6" ry="4" fill="#7C5295"/>
    <ellipse cx="276" cy="288" rx="5.5" ry="3.5" fill="#9A7AA0"/>
    <ellipse cx="260" cy="300" rx="6" ry="4" fill="#6A3B82"/>
  </g>

  <!-- Glass Dew Sphere on Left of Pedestal -->
  <g opacity="0.8">
    <circle cx="135" cy="280" r="14" fill="radial-gradient(circle at 35% 30%, #FFF 0%, rgba(200,220,240,0.5) 70%, rgba(140,160,190,0.2) 100%)"/>
    <circle cx="131" cy="275" r="4" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Stone Pedestal -->
  <g filter="url(#slp-shadow)">
    <path d="M 80 370 C 80 370 120 420 200 420 C 280 420 320 370 320 370 L 320 405 C 320 405 280 455 200 455 C 120 455 80 405 80 405 Z" fill="url(#slp-pedestal-front)"/>
    <ellipse cx="200" cy="370" rx="120" ry="34" fill="url(#slp-pedestal-top)"/>

    <path d="M 95 345 C 95 345 130 385 200 385 C 270 385 305 345 305 345 L 305 365 C 305 365 270 405 200 405 C 130 405 95 365 95 365 Z" fill="url(#slp-pedestal-front)"/>
    <ellipse cx="200" cy="345" rx="105" ry="28" fill="url(#slp-pedestal-top)"/>
    <ellipse cx="150" cy="345" rx="5" ry="2" fill="#C4B6A0" opacity="0.6"/>
    <ellipse cx="225" cy="348" rx="6" ry="2" fill="#C4B6A0" opacity="0.5"/>
  </g>

  <!-- Vial Shadow -->
  <ellipse cx="200" cy="336" rx="34" ry="11" fill="#58432F" opacity="0.45" filter="url(#slp-shadow)"/>

  <!-- Sleek Roll-On Vial -->
  <g filter="url(#slp-shadow)">
    <!-- Tall Cap (Black Matte) -->
    <rect x="182" y="145" width="36" height="65" rx="4" fill="url(#slp-cap-black)"/>
    <path d="M 184 148 L 186 208 C 186 208 190 209 191 206 L 190 148 Z" fill="#FFFFFF" opacity="0.15"/>

    <!-- Amber Glass Body -->
    <path d="M 183 210 L 217 210 L 217 326 C 217 334 210 338 200 338 C 190 338 183 334 183 326 Z" fill="url(#slp-amber-glass)"/>
    <!-- Specular highlight -->
    <path d="M 186 210 L 188 325 C 188 327 192 328 194 326 L 192 210 Z" fill="#FFFFFF" opacity="0.32"/>

    <!-- White Label -->
    <rect x="184" y="228" width="32" height="88" rx="2" fill="#FAF6EE"/>
    <rect x="184" y="228" width="2.5" height="88" fill="#000000" opacity="0.12"/>
    <rect x="213.5" y="228" width="2.5" height="88" fill="#000000" opacity="0.12"/>

    <path d="M 200 236 C 197 238 195 241 200 244 C 205 241 203 238 200 236 Z" fill="#7C3AED"/>
    <text x="200" y="252" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="6.5" font-weight="800" fill="#1C2B2B" letter-spacing="1">SANAN</text>
    <line x1="188" y1="256" x2="212" y2="256" stroke="#7C3AED" stroke-width="0.7"/>

    <text x="200" y="268" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="7.5" font-weight="400" fill="#182626">SleepWell</text>
    <text x="200" y="276" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="4" font-weight="700" fill="#7C3AED" letter-spacing="0.5">PULSE OIL</text>
    <text x="200" y="286" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="3.5" fill="#758282">Calm • Relax • Sleep</text>
    <text x="200" y="304" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="4" font-weight="600" fill="#1C2B2B">10 ml</text>
  </g>
</svg>
