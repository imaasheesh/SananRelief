<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="labBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1A1A"/>
      <stop offset="45%" stop-color="#142626"/>
      <stop offset="85%" stop-color="#1C3837"/>
      <stop offset="100%" stop-color="#091212"/>
    </linearGradient>
    <radialGradient id="alembicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5A642" stop-opacity="0.7"/>
      <stop offset="30%" stop-color="#A86E20" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#439798" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0E1A1A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amberLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7D070"/>
      <stop offset="40%" stop-color="#E29A26"/>
      <stop offset="100%" stop-color="#995E0B"/>
    </linearGradient>
    <linearGradient id="glassStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#439798" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#labBg)"/>

  <!-- Warm extraction glow aura -->
  <circle cx="680" cy="330" r="320" fill="url(#alembicGlow)"/>

  <!-- Botanical shadow patterns behind apparatus -->
  <g fill="#439798" opacity="0.08" transform="translate(100, 40)">
    <path d="M400,100 C500,150 560,280 520,400 C450,330 380,260 320,200 Z"/>
    <path d="M520,80 C620,160 640,300 600,420 C540,330 480,240 440,180 Z"/>
    <path d="M640,60 C740,120 780,260 740,380 C680,280 620,200 580,140 Z"/>
  </g>

  <!-- Surface Lab Slate Table -->
  <path d="M0,520 Q600,500 1200,520 L1200,675 L0,675 Z" fill="#0A1313"/>

  <!-- Central Extraction Alembic Flask Apparatus -->
  <g transform="translate(620, 160)">
    <!-- Liquid in Flask base -->
    <path d="M-60,330 C-90,330 -140,290 -120,220 L-40,100 L40,100 L120,220 C140,290 90,330 60,330 Z" fill="url(#amberLiquid)" opacity="0.85" filter="url(#glowFilter)"/>

    <!-- Glass Flask Outer Wall -->
    <path d="M-28,-20 L28,-20 L28,70 L135,225 C160,260 145,340 60,345 L-60,345 C-145,340 -160,260 -135,225 L-28,70 Z" fill="none" stroke="url(#glassStroke)" stroke-width="3.5" opacity="0.85"/>

    <!-- Condenser Coils / Tube System -->
    <path d="M0,-20 L0,-70 Q0,-100 40,-100 L180,-100 Q220,-100 220,-60 L220,180 Q220,210 250,210 L300,210" fill="none" stroke="url(#glassStroke)" stroke-width="3" opacity="0.7"/>

    <!-- Suspended Golden Distillate Droplet -->
    <path d="M0,45 C0,45 -8,58 -8,66 A8,8 0 0,0 8,66 C8,58 0,45 0,45 Z" fill="#FFE28A" filter="url(#glowFilter)"/>

    <!-- Concentrated Vapor Bubbles -->
    <circle cx="-30" cy="240" r="5" fill="#FFF2CE" opacity="0.75"/>
    <circle cx="20" cy="210" r="3.5" fill="#FFF2CE" opacity="0.6"/>
    <circle cx="50" cy="270" r="6" fill="#FFF2CE" opacity="0.8"/>
    <circle cx="-10" cy="290" r="4.5" fill="#FFF2CE" opacity="0.7"/>
    <circle cx="4" cy="180" r="3" fill="#FFF2CE" opacity="0.9"/>
  </g>

  <!-- Left Side: Botanical Sample Dish & Pipette -->
  <g transform="translate(320, 440)">
    <ellipse cx="60" cy="80" rx="90" ry="22" fill="#0F2121" stroke="#2B4E4D" stroke-width="2"/>
    <ellipse cx="60" cy="80" rx="80" ry="18" fill="url(#amberLiquid)" opacity="0.5"/>
    <!-- Fresh green Vijaya leaflet inside dish -->
    <path d="M40,78 Q60,65 95,78 Q65,85 40,78 Z" fill="#439798" opacity="0.8"/>
  </g>

  <!-- Fine Floating Amber Light Orbs -->
  <circle cx="680" cy="260" r="2" fill="#FFE8A3" opacity="0.8"/>
  <circle cx="760" cy="310" r="3" fill="#FFE8A3" opacity="0.7"/>
  <circle cx="590" cy="360" r="1.5" fill="#FFE8A3" opacity="0.6"/>
  <circle cx="820" cy="240" r="2.5" fill="#FFE8A3" opacity="0.5"/>
</svg>

