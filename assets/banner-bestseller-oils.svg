<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bnOilBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F1EC"/>
      <stop offset="50%" stop-color="#F2EDE2"/>
      <stop offset="100%" stop-color="#D4E4DC"/>
    </linearGradient>
  </defs>
  <rect width="340" height="600" rx="28" fill="url(#bnOilBg)"/>
  <!-- Botanical Branches & Drops -->
  <g fill="#3D7A64" opacity="0.2" transform="translate(60, 40)">
    <path d="M0,40 C60,20 120,60 140,120 C90,120 40,80 0,40 Z"/>
    <path d="M40,100 C100,80 160,110 180,180 C130,170 80,130 40,100 Z"/>
  </g>
  <!-- Laboratory Glass Pipette with Golden Droplet -->
  <g transform="translate(130, 240)">
    <circle cx="40" cy="100" r="90" fill="#FFF9EB" opacity="0.75"/>
    <!-- Glass Tincture Dropper -->
    <rect x="36" y="20" width="8" height="130" rx="4" fill="#FFFFFF" stroke="#BACAC3" stroke-width="2"/>
    <rect x="38" y="70" width="4" height="75" rx="2" fill="#F59E0B" opacity="0.85"/>
    <path d="M40,170 C34,170 30,162 40,154 C50,162 46,170 40,170 Z" fill="#F59E0B"/>
    <!-- Bottle in background -->
    <rect x="75" y="65" width="45" height="85" rx="8" fill="#5E381C" opacity="0.85"/>
    <rect x="85" y="52" width="25" height="15" rx="3" fill="#1C2120"/>
  </g>
  <!-- Circular Ripple Lines at bottom -->
  <circle cx="170" cy="510" r="70" stroke="#CCDED6" stroke-width="2" fill="none" opacity="0.6"/>
  <circle cx="170" cy="510" r="110" stroke="#CCDED6" stroke-width="1.5" fill="none" opacity="0.4"/>
</svg>
