<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="pain-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A4A4B"/>
      <stop offset="40%" stop-color="#2D6E6F"/>
      <stop offset="80%" stop-color="#439798"/>
      <stop offset="100%" stop-color="#E07A5F"/>
    </linearGradient>
    <radialGradient id="sun-glow" cx="80%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#FFE8D6" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#F4A261" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2D6E6F" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background Warm Sky & Atmosphere -->
  <rect width="100%" height="100%" fill="url(#pain-grad)"/>
  <rect width="100%" height="100%" fill="url(#sun-glow)"/>

  <!-- Morning Sun Orb -->
  <circle cx="480" cy="180" r="110" fill="#FFF3E0" opacity="0.75" filter="url(#soft-blur)"/>
  <circle cx="480" cy="180" r="60" fill="#FFFFFF" opacity="0.9"/>

  <!-- Athletic Silhouette / Soothing Movement -->
  <!-- Back & Shoulder stretch pose -->
  <g fill="#163A3B" opacity="0.92">
    <!-- Torso -->
    <path d="M 230 460 C 210 390 230 310 280 260 C 310 230 360 215 400 220 C 435 225 450 255 440 290 C 425 340 370 410 330 460 Z"/>
    <!-- Head & Neck -->
    <circle cx="390" cy="195" r="32"/>
    <path d="M 370 215 C 365 240 375 255 390 260 C 405 255 415 240 410 215 Z"/>
    <!-- Raised Arm / Stretch -->
    <path d="M 430 250 C 465 210 500 160 525 110 C 535 125 530 145 505 185 C 475 230 445 270 425 285 Z"/>
    <!-- Supporting Arm -->
    <path d="M 265 280 C 235 320 205 380 185 440 C 198 448 215 445 235 395 C 255 350 275 310 285 295 Z"/>
    <!-- Lower Body / Mountain Horizon -->
    <path d="M 0 540 Q 200 480 420 520 Q 520 540 600 500 L 600 750 L 0 750 Z" fill="#0F2B2C"/>
  </g>

  <!-- Botanical Arnica & Eucalyptus Leaf Silhouette Foreground -->
  <g fill="#0B2021" opacity="0.85">
    <path d="M 0 750 Q 80 620 160 550 C 130 580 90 640 60 750 Z"/>
    <path d="M 80 750 Q 140 600 240 520 C 210 560 170 630 130 750 Z"/>
    <path d="M 40 660 C 15 630 0 600 0 570 C 20 590 50 630 65 670 Z"/>
    <path d="M 110 610 C 95 560 85 520 80 480 C 105 510 120 560 125 615 Z"/>
    <path d="M 180 560 C 185 510 200 460 220 420 C 215 470 205 520 195 570 Z"/>
  </g>

  <!-- Golden Healing Light Beams -->
  <g opacity="0.25">
    <polygon points="480,180 200,750 280,750" fill="#FFFFFF"/>
    <polygon points="480,180 340,750 420,750" fill="#FFE8D6"/>
    <polygon points="480,180 80,750 140,750" fill="#FFF3E0"/>
  </g>
</svg>
