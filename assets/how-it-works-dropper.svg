<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE9FE"/>
      <stop offset="50%" stop-color="#DDD6FE"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <radialGradient id="glowG" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amberOil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="amberDrop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4C1D95" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="600" height="650" rx="24" fill="url(#bgGrad)"/>
  <circle cx="300" cy="320" r="240" fill="url(#glowG)"/>

  <!-- Ambient Botanical Leaves in Background -->
  <path d="M120 180 C80 120 110 50 170 80 C190 140 160 210 120 180 Z" fill="#7C3AED" opacity="0.12"/>
  <path d="M480 200 C530 140 500 70 440 90 C420 160 450 230 480 200 Z" fill="#7C3AED" opacity="0.12"/>
  <path d="M100 480 C50 430 80 350 140 370 C160 440 130 510 100 480 Z" fill="#7C3AED" opacity="0.08"/>

  <!-- Minimalist Hand & Arm Silhouette -->
  <path d="M160 650 C180 520 230 470 290 440 C340 415 370 410 410 430 C450 450 490 530 520 650 Z" fill="#E2D9F3"/>

  <!-- Amber Medical Tincture Bottle -->
  <g filter="url(#cardShadow)">
    <!-- Bottle Base -->
    <rect x="235" y="320" width="130" height="230" rx="20" fill="url(#amberOil)"/>
    <!-- Glass Highlights -->
    <path d="M245 330 L255 330 L255 530 L245 530 Z" fill="#FFFFFF" opacity="0.35"/>
    <path d="M350 330 L355 330 L355 530 L350 530 Z" fill="#FFFFFF" opacity="0.2"/>

    <!-- Bottle Label -->
    <rect x="245" y="380" width="110" height="135" rx="8" fill="#FFFFFF"/>
    <rect x="255" y="395" width="90" height="12" rx="3" fill="#0E2929"/>
    <text x="300" y="404" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">SANAN RELIEF</text>
    <text x="300" y="428" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="700" fill="#0E2929" text-anchor="middle">Vijaya Oil</text>
    <text x="300" y="446" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#059669" text-anchor="middle">FULL SPECTRUM</text>
    <line x1="265" y1="460" x2="335" y2="460" stroke="#E5E7EB" stroke-width="1"/>
    <text x="300" y="475" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" fill="#4B5563" text-anchor="middle">1000mg • 30ml</text>
    <text x="300" y="492" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="700" fill="#7C3AED" text-anchor="middle">AYUSH CERTIFIED</text>

    <!-- Bottle Neck -->
    <rect x="270" y="275" width="60" height="50" rx="4" fill="url(#amberOil)"/>
    <rect x="260" y="260" width="80" height="20" rx="4" fill="#0E2929"/>

    <!-- Dropper Pipette Pip & Bulb -->
    <path d="M280 150 C280 110 320 110 320 150 L320 210 L280 210 Z" fill="#1F2937"/>
    <rect x="272" y="210" width="56" height="25" rx="3" fill="#E5E7EB"/>
    <line x1="272" y1="222" x2="328" y2="222" stroke="#9CA3AF" stroke-width="1.5"/>

    <!-- Glass Pipette Stem -->
    <rect x="294" y="235" width="12" height="120" rx="2" fill="#FFFFFF" opacity="0.75" stroke="#D1D5DB" stroke-width="1"/>
    <path d="M294 340 L300 370 L306 340 Z" fill="#FFFFFF" opacity="0.75"/>

    <!-- Amber Liquid inside Pipette -->
    <rect x="296" y="280" width="8" height="70" fill="url(#amberDrop)"/>

    <!-- Suspended Golden Droplet Falling -->
    <path d="M300 405 C290 425 285 440 285 450 C285 465 292 475 300 475 C308 475 315 465 315 450 C315 440 310 425 300 405 Z" fill="url(#amberDrop)" filter="url(#cardShadow)"/>
    <!-- Glisten Sparkle -->
    <circle cx="295" cy="452" r="3" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Clean Floating Badge: 100% Bioavailable -->
  <rect x="360" y="160" width="180" height="48" rx="24" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <circle cx="384" cy="184" r="14" fill="#EDE9FE"/>
  <text x="384" y="189" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#7C3AED" text-anchor="middle">✓</text>
  <text x="410" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#1E1B4B">Direct Buccal Path</text>
  <text x="410" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#6B7280">98% Cellular Uptake</text>
</svg>