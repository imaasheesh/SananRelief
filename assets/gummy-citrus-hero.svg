<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_citrus" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#CA8A04" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#713F12" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1A0E02" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="pouchGrad_citrus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#422006"/>
      <stop offset="100%" stop-color="#08020F"/>
    </linearGradient>
    <filter id="shadow_citrus" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="32" stdDeviation="36" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" rx="36" fill="url(#bgGlow_citrus)"/>

  <!-- Ambient Dynamic Rays -->
  <circle cx="400" cy="400" r="320" fill="none" stroke="#FEF08A" stroke-opacity="0.1" stroke-width="1.5" stroke-dasharray="8 8"/>
  <circle cx="400" cy="400" r="240" fill="none" stroke="#FEF08A" stroke-opacity="0.15" stroke-width="2"/>
  <circle cx="400" cy="400" r="160" fill="none" stroke="#FEF08A" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Floating Recreational Glow Orbs -->
  <circle cx="210" cy="220" r="14" fill="#FEF08A" opacity="0.6"/>
  <circle cx="610" cy="260" r="22" fill="#EAB308" opacity="0.4"/>
  <circle cx="580" cy="620" r="16" fill="#CA8A04" opacity="0.5"/>
  <circle cx="220" cy="580" r="18" fill="#FEF08A" opacity="0.45"/>

  <!-- Main Gummy Pouch -->
  <g filter="url(#shadow_citrus)">
    <!-- Pouch Body -->
    <path d="M280,180 C280,165 295,155 315,155 L485,155 C505,155 520,165 520,180 L555,590 C558,620 535,645 505,645 L295,645 C265,645 242,620 245,590 Z"
          fill="url(#pouchGrad_citrus)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>

    <!-- Pouch Top Zip / Tear Notch -->
    <path d="M290,195 L510,195" stroke="#EAB308" stroke-width="4" stroke-dasharray="10 5" stroke-linecap="round"/>
    <path d="M245,215 L255,220 L245,225" fill="#EAB308"/>
    <path d="M555,215 L545,220 L555,225" fill="#EAB308"/>

    <!-- Pouch Brand Header -->
    <text x="400" y="275" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">SANAN RELIEF</text>
    <text x="400" y="302" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FEF08A" text-anchor="middle" letter-spacing="3">CLINICAL VIJAYA VATIS</text>

    <!-- Center Emblem / Leaf Burst -->
    <circle cx="400" cy="385" r="54" fill="rgba(255,255,255,0.06)" stroke="#EAB308" stroke-width="2"/>
    <g transform="translate(400,385) scale(1.6)">
      <path d="M0,-20 C5,-10 15,-5 20,0 C15,5 5,10 0,20 C-5,10 -15,5 -20,0 C-15,-5 -5,-10 0,-20 Z" fill="#FEF08A"/>
      <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
    </g>

    <!-- Product Title & Subtitle -->
    <text x="400" y="475" font-family="'DM Serif Display', Georgia, serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle">UPLIFT</text>
    <rect x="310" y="492" width="180" height="26" rx="13" fill="#F1C40F" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <text x="400" y="509" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">SOUR CITRUS LEMON</text>

    <!-- Potency Callout -->
    <text x="400" y="548" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0" text-anchor="middle">200mg Active Botanical Actives</text>
    <text x="400" y="570" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#FEF08A" text-anchor="middle" letter-spacing="1">SOLAR SURGE &amp; DAYTIME FLOW</text>

    <!-- Bottom Wave Ribbon -->
    <path d="M255,600 Q400,620 545,600" stroke="#EAB308" stroke-width="2.5" fill="none" opacity="0.6"/>
  </g>

  <!-- Big Delicious Floating Gummies in Foreground -->
  <g filter="url(#shadow_citrus)">
    <!-- Gummy 1 (Left) -->
    <rect x="180" y="600" width="85" height="85" rx="28" fill="#F1C40F" stroke="#FEF08A" stroke-width="2" transform="rotate(-15 222 642)"/>
    <circle cx="210" cy="630" r="8" fill="#FFFFFF" opacity="0.5"/>

    <!-- Gummy 2 (Right) -->
    <rect x="535" y="590" width="95" height="95" rx="30" fill="#EAB308" stroke="#FFFFFF" stroke-width="2" transform="rotate(20 582 637)"/>
    <circle cx="570" cy="625" r="10" fill="#FFFFFF" opacity="0.6"/>
  </g>
</svg>