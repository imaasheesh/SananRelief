<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F3EB"/>
      <stop offset="100%" stop-color="#EBE3D3"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bgGrad3)"/>
  <!-- Open research notebook -->
  <g transform="translate(180, 100)">
    <rect x="0" y="0" width="130" height="180" rx="6" fill="#FDFCF8" stroke="#D8D0BF" stroke-width="2"/>
    <rect x="130" y="0" width="130" height="180" rx="6" fill="#FAF6EE" stroke="#D8D0BF" stroke-width="2"/>
    <line x1="130" y1="0" x2="130" y2="180" stroke="#B8A88E" stroke-width="3"/>
    <!-- Notebook lines & plant sketch -->
    <g stroke="#99B5A8" stroke-width="2" opacity="0.6">
      <line x1="20" y1="30" x2="110" y2="30"/>
      <line x1="20" y1="50" x2="110" y2="50"/>
      <line x1="20" y1="70" x2="110" y2="70"/>
      <line x1="20" y1="90" x2="80" y2="90"/>
    </g>
    <!-- Botanical sketch on right page -->
    <path d="M195,140 Q190,80 195,40" stroke="#3D6E57" stroke-width="2" fill="none"/>
    <ellipse cx="180" cy="70" rx="15" ry="8" fill="#5BA188" opacity="0.7"/>
    <ellipse cx="210" cy="90" rx="15" ry="8" fill="#5BA188" opacity="0.7"/>
    <ellipse cx="195" cy="40" rx="10" ry="15" fill="#4B8C74" opacity="0.8"/>
  </g>
  <!-- Dried herbs and dried flower on left -->
  <g transform="translate(80, 160)">
    <circle cx="40" cy="40" r="30" fill="#EAE2CE"/>
    <path d="M40,25 C30,35 30,50 40,55 C50,50 50,35 40,25 Z" fill="#9C6B38"/>
    <circle cx="40" cy="40" r="10" fill="#F3A83B"/>
  </g>
</svg>
